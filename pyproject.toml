[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Personalized violin feedback from a video and a score"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]   # ffmpeg (system binary) is also required; Audiveris (OMR) and git (VioPose) are optional

[project.scripts]
maestro-gui = "maestro.gui.server:main"

[project.optional-dependencies]
dev = ["pytest"]
crepe = ["torch>=2.0", "torchcrepe>=0.0.23", "librosa>=0.10.2"]   # the default pitch backend (the backend imports librosa)
pyin = ["librosa>=0.10.2"]
basic-pitch = ["basic-pitch>=0.3.0"]
fusion = ["torch>=2.0"]                       # run the trained fusion encoders (models/fusion/)
training = ["torch>=2.0", "music21>=9", "yt-dlp"]   # train them: music21 = bundled scores, yt-dlp = the youtube-cc video dataset
neural = ["torch>=2.0", "transformers>=4.40"]   # the optional CLAP tone/expression judgement (analyze(neural="clap"))
audio = ["torch>=2.0", "torchcrepe>=0.0.23", "librosa>=0.10.2", "basic-pitch>=0.3.0"]   # all four pitch backends

[tool.setuptools.packages.find]
where = ["src"]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["gui/*.html"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "src/tests"]
