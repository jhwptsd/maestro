[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Personalized violin feedback from a video and a score"
requires-python = ">=3.10"
dependencies = ["numpy"]   # ffmpeg (system binary) is also required; Audiveris is optional (OMR)

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maestro*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "src/tests"]
