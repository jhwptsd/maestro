[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Personalized violin feedback from a video and a score"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]   # ffmpeg (system binary) is also required; Audiveris (OMR) and git (VioPose) are optional

[project.scripts]
maestro-gui = "maestro.gui.server:main"

[project.optional-dependencies]
dev = ["pytest"]
crepe = ["torch>=2.0", "torchcrepe>=0.0.23", "librosa>=0.10.2", "onnx", "onnxruntime"]   # the default pitch backend (ONNX Runtime runs its network ~2x faster than PyTorch on the CPU)
directml = ["onnxruntime-directml"]           # Windows: runs the CREPE network on any DirectX 12 GPU (AMD, Intel, NVIDIA); REPLACES onnxruntime (pip uninstall onnxruntime first; setup.ps1 does)
app = ["flet>=1.1", "flet-video", "flet-audio-recorder", "flet-camera", "flet-charts", "flet-permission-handler", "Pillow"]   # the Flet app (src/main.py)
pyin = ["librosa>=0.10.2"]
basic-pitch = ["basic-pitch>=0.3.0"]
separation = ["torch>=2.0", "torchaudio", "demucs"]   # optional Demucs stem separation of the reference (analyze --separate)
neural = ["torch>=2.0", "transformers>=4.40"]   # the optional CLAP tone/expression judgement (analyze(neural="clap"))
audio = ["torch>=2.0", "torchcrepe>=0.0.23", "librosa>=0.10.2", "basic-pitch>=0.3.0"]   # all four pitch backends

[tool.setuptools.packages.find]
where = ["src"]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["gui/*.html", "gui/*.js"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "src/tests"]

# `flet build apk|ipa|windows|macos|linux` (see the README, "The app"): the app is src/main.py with the maestro package beside it.
[tool.flet]
product = "Maestro"
org = "com.maestro"
company = "Maestro"
copyright = "Maestro"

[tool.flet.app]
path = "src"

[tool.flet.ios.info]
NSMicrophoneUsageDescription = "Maestro listens to your playing to give you feedback."
NSCameraUsageDescription = "Maestro uses the camera to film your take and to scan your sheet music."

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.CAMERA" = true
