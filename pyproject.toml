[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Personalized violin feedback from a video and a score"
requires-python = ">=3.10"
dependencies = ["numpy"]   # ffmpeg (system binary) is also required; Audiveris is optional (OMR)

[project.scripts]
maestro-gui = "maestro.gui.server:main"

[project.optional-dependencies]
dev = ["pytest"]
crepe = ["torch>=2.0", "torchcrepe>=0.0.23"]
pyin = ["librosa>=0.10.2"]
basic-pitch = ["basic-pitch>=0.3.0"]
audio = ["torch>=2.0", "torchcrepe>=0.0.23", "librosa>=0.10.2", "basic-pitch>=0.3.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maestro*"]

[tool.setuptools.package-data]
maestro = ["gui/*.html"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src", "src/tests"]
